server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # 子应用不存在的资源应返回 404，不能落入主应用 SPA fallback。
    location ^~ /micro-apps/data-center/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /admin-api/ {
        proxy_pass http://yudao-server:48080;
        # 外部客户端不能透传网关内部使用的已认证身份。
        proxy_set_header login-user "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 原平台 WebSocket；路径与后端 yudao.websocket.path 保持一致。
    location /infra/ws {
        proxy_pass http://yudao-server:48080;
        # WebSocket 握手也必须由后端校验 token。
        proxy_set_header login-user "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
