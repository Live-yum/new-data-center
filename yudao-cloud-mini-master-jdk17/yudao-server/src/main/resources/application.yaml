spring:
  application:
    name: yudao-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgresql}
  main:
    allow-circular-references: true # 保持原项目三层架构的循环依赖处理方式
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 需要密码时设置 SPRING_DATA_REDIS_PASSWORD；无密码时不绑定空字符串，避免 Redisson 发送 AUTH。
      repositories:
        enabled: false
  boot:
    admin:
      client:
        enabled: false

server:
  port: ${SERVER_PORT:48080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

logging:
  file:
    name: ${LOG_FILE:./logs/yudao-server.log}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui
  default-flat-param-object: true
knife4j:
  enable: ${API_DOCS_ENABLED:true}
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  type-aliases-package: ${yudao.info.base-package}.module.*.dal.dataobject
mybatis-plus-join:
  banner: false
easy-trans:
  is-enable-global: false

xxl:
  job:
    enabled: false # 接入独立调度中心后，在外部配置中启用
aj:
  captcha:
    cache-type: redis
    type: blockPuzzle
    water-mark: 数据中心
    req-frequency-limit-enable: true
justauth:
  cache:
    type: REDIS

# 上游社交服务在启动时注入微信客户端。占位值仅用于未接入微信的本地运行，调用微信前须配置真实值。
wx:
  mp:
    app-id: ${WX_MP_APP_ID:local-disabled}
    secret: ${WX_MP_SECRET:local-disabled}
  miniapp:
    appid: ${WX_MINIAPP_APP_ID:local-disabled}
    secret: ${WX_MINIAPP_SECRET:local-disabled}

yudao:
  info:
    version: 2026.09
    base-package: cn.iocoder.yudao
  rpc:
    enabled: false # 聚合启动时直接注入本地 API 实现；独立微服务仍默认启用 Feign
  web:
    admin-ui:
      url: ${ADMIN_UI_URL:http://localhost:5173}
  security:
    mock-enable: false
    trust-login-user-header: false # 聚合服务直接验证 token，不信任外部 login-user 身份头
  captcha:
    enable: ${CAPTCHA_ENABLED:true}
  api-encrypt:
    enable: false
  websocket:
    enable: true
    path: /infra/ws
    sender-type: local
  swagger:
    title: 数据中心管理后台
    description: 系统管理、基础设施与数据中心公共组件
    author: Live-yum
    version: ${yudao.info.version}
    url: ${yudao.web.admin-ui.url}
    email: ${CONTACT_EMAIL:maintainer@example.com}
    license: MIT
    license-url: https://opensource.org/license/mit
  codegen:
    base-package: ${yudao.info.base-package}
    front-type: 50 # Vben 5 + Element Plus，与默认主应用一致
    vo-type: 10
    delete-batch-enable: true
    unit-test-enable: false
    import-enable: false
  tenant:
    enable: true
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 100000
    end-code: 999999
  realdb:
    enabled: ${REALDB_ENABLED:false} # 只读取部署外部配置，不在浏览器录入凭据
    base-url: ${REALDB_URL:}
    username: ${REALDB_USERNAME:}
    password: ${REALDB_PASSWORD:}
    token: ${REALDB_TOKEN:}
  iot:
    realdb-zone: ${REALDB_ZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
