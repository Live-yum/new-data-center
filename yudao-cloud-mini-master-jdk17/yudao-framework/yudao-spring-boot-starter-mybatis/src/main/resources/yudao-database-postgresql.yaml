# 单体、独立微服务和配置中心均可通过 spring.config.import 复用。
spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ruoyi-vue-pro}?currentSchema=${DB_SCHEMA:public}}
          username: ${DB_USERNAME:yudao}
          password: ${DB_PASSWORD}
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
  sql:
    init:
      mode: never # 初始化脚本包含 DROP，仅允许人工在全新数据库中执行。
  quartz:
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

mybatis-plus:
  global-config:
    db-config:
      id-type: INPUT # 配合 DO 的 @KeySequence 和 SQL 中的 *_seq。
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    jdbc-type-for-null: 'NULL'

yudao:
  mybatis:
    numeric-boolean: true # 按 JDBC 参数类型兼容随仓库 SQL 混用的 BOOL / int2 布尔列。
  codegen:
    db-schemas:
      - ${DB_SCHEMA:public}
